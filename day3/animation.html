<html>
    <head>
        <style>
            div{
                height: 100px;
                width: 100px;
                background-color: red;
                animation-name: anime;
                animation-duration: 10s;
                transition-property: transform;
                transition-duration: 1s;
                position: relative;
                top: 20px;
                left: 20px;
            }
            @keyframes anime{
                0%   {left: 20px;top: 20px;}
                25%  {left: 200px;top: 20px;background-color: red;}
                50%  {top: 200px;left: 200px;background-color: rgb(255, 68, 131);}
                75%  {left: 20px;top: 200px;background-color: blue;}
                100% {top: 20px;left: 20px;background-color: blueviolet;}
            }
        </style>

    </head>
    <body>
        <div>

        </div>
        
    </body>
</html>
